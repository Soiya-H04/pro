<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素显示转换</title>
    <style>
        /* 行内元素 -> 块元素 */
        span {
            display: block;
        }
        /* 块元素 -> 行内元素 */
        div {
            display: inline;
        }
        /* 行内、块元素 -> 行内块元素  */
        
        a,
        p {
            display: inline-block;
        }

    </style>
</head>
<body>
    
</body>
</html>
