<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emmet 语法</title>
</head>
<body>
    <!-- div tab  -->
    <div></div>

    <!-- div*3 -->
     <div></div>
     <div></div>
     <div></div>
    
    <!-- div>ul*2>li*3 -->
    <div>
        <ul>
            <li></li>
            <li></li>
            <li></li>
        </ul>
        <ul>
            <li></li>
            <li></li>
            <li></li>
        </ul>
    </div>
    
    <!-- div+p+ul+span -->
    <div></div>
    <p></p>
    <ul></ul>
    <span></span>

    <!-- ul.name#time -->
    <ul class="name" id="time"></ul>

    <!-- ul.my$*10 -->
    <ul class="my1"></ul>
    <ul class="my2"></ul>
    <ul class="my3"></ul>
    <ul class="my4"></ul>
    <ul class="my5"></ul>
    <ul class="my6"></ul>
    <ul class="my7"></ul>
    <ul class="my8"></ul>
    <ul class="my9"></ul>
    <ul class="my10"></ul>

    <!-- span{sss} -->
    <span>sss</span>

    <style>
        div {
            /* w200 */
            width: 200px;
            /* tac */
            text-align: center;
        }
    </style>
</body>
</html>
