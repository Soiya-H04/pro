<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>列表 tag</title>
</head>
<body>
    <!-- 有序列表 -->
    <h4>周姓歌手</h4>
    <ol>
        <li>周杰伦</li>
        <li>周慧敏</li>
        <li>周洁琼</li>
        <li>周星星</li>
    </ol>

    <!-- 无序列表 -->
    <h4>周姓歌手</h4>
    <ul>
        <li>周杰伦</li>
        <li>周慧敏</li>
        <li>周洁琼</li>
        <li>周星星</li>
    </ul>

    <!-- 自定义列表 -->
    <dl>
        <dt><strong>周姓歌手</strong></dt>
        <dd>周星星</dd>
        <dd>周杰伦</dd>
        <dd>周慧敏</dd>
        <dd>周洁琼</dd>
    </dl>
</body>
</html>
