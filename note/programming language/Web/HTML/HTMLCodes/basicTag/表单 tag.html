<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单 tag</title>
</head>
<body>
    <form name="第一个表单">
        <!-- text -->
        文本框：<input type = "text"><br>

        <!-- passwd -->
        密码框：<input type="password"><br>
        
        <!-- radio -->
        单选：  <input type="radio" name="radio"checked="checked" >
                <input type="radio" name="radio"> 
                <input type="radio" name="radio"> 
                <input type="radio" name="radio"> <br>

        <!-- checkbox -->
        复选：   <input type="checkbox" name="checkbox" checked="checked">
                 <input type="checkbox" name="checkbox">
                 <input type="checkbox" name="checkbox"> 
                 <input type="checkbox" name="checkbox"> <br>

        <!-- reset -->
        <input type="reset" value="重置"> <br>

        <!-- submit -->
         <input type="submit" value="提交"> <br>

        <!-- button -->
        <input type="button" value="按钮"><br>

        <!-- image -->
        <input type="image" src="../mySource/basicTag/img.jpg"> <br>

        <!-- label -->
        <label for="text">按这里输入</label>
        <input type="text" id="text"> <br>

        <!-- select -->
        <select name="select" id="select">
            <option selected="select">广西</option>
            <option>深圳</option>
            <option>广东</option>
        </select><br>

        <!-- textarea -->
        <textarea name="textarea" id="textarea"></textarea>
    </form>
    
</body>
</html>
