<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超链接 tag</title>
</head>
<body>
    <!-- 
    href:链接地址
    target:打开方式
    _blank 新页面
    _parent 当前页面
     -->
    <!-- 外部链接 -->
    <a href="http://www.baidu.com", target="_parent", id="baidu">百度</a>
    <!-- 内部链接 -->
    <a href="图像 tag.html", target="_blank"">图像 tag.html</a>
    <!-- 空链接 -->
     <a href="#"> 空链接</a>
     <!-- 下载文件 -->
    <a href="../mySource/basicTagIMG/img.zip">下载 zip</a>
    <!-- 图片进行超链接 -->
     <a href="http://www.baidu.com"><img src="../mySource/basicTagIMG/img.jpg" alt="去往百度"></a>
    <!-- 
     锚点链接
     使用 id 属性
     -->
     <a href="#baidu">跳转到锚点:baidu </a>
     &lt; &lt;

</body>
</html>
