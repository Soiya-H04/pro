<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册表</title>
</head>
<body>
    <h4></h4>
    <table width="600px">
        <tr>
            <td>性别：</td>
            <td>
                <input type="radio" name="sex" id="male"><label for="male"><img src="../../mySource/basicTag/案例/images/man.jpg" alt="男">男</label>
                <input type="radio" name="sex" id="female"><label for="female"><img src="../../mySource/basicTag/案例/images/women.jpg" alt="女">女</label>
            </td>
        </tr>
        <tr>
            <td>生日：</td>
            <td>
                <select>
                    <option>--请选择年份--</option>
                    <option>2001</option>
                    <option>2002</option>
                    <option>2003</option>
                </select>
                <select>
                    <option>--请选择月份--</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                </select>
                <select>
                    <option>--请选择日期--</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>所在区域：</td>
            <td>
                <input type="text" value="北京">
            </td>
        </tr>
        <tr>
            <td>婚姻状况：</td>
            <td>
                <input type="radio" name="marry">已婚
                <input type="radio" name="marry">未婚
                <input type="radio" name="marry">离异
                <input type="radio" name="marry">丧偶
            </td>
        </tr>
        <tr>
            <td>学历：</td>
            <td>
                <input type="text" value="博士">
            </td>
        </tr>
        <tr>
            <td>喜欢：</td>
            <td>
                <input type="checkbox" name="love">妩媚
                <input type="checkbox" name="love">清纯
                <input type="checkbox" name="love">年轻
                <input type="checkbox" name="love">成熟
                <input type="checkbox" name="love">都喜欢
            </td>
        </tr>
        <tr>
            <td>个人简介</td>
            <td>
                <textarea name="introduce" >个人简介</textarea>
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <button>免费注册</button>
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <input type="checkbox"> 我同意注册条款和会员加入标准 
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <a href="#">我是会员 立即登录</a>
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <h5>我承诺:</h5>
                <ul>
                    <li>年满18 单身</li>
                    <li>抱着严肃的态度</li>
                    <li>真诚寻找另一半</li>
                </ul>
            </td>
        </tr>
    </table>
</body>
</html>
