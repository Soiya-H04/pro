<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格 tag</title>
</head>
<body>
    <!-- 表格 -->
    <table>
        <!-- 行 -->
        <tr>
            <!-- 单元格(标题) -->
            <th>姓名</th>
            <th>性别</th>
            <th>年龄</th>
            <th>宗门</th>
            <th>资质</th>
            <th>武魂</th>
        </tr>
        <tr>
            <!-- 单元格（内容） -->
            <td>消炎</td>
            <td>男</td>
            <td>19</td>
            <td>斗破苍穹</td>
            <td>三段斗之力</td>
            <td>佛怒唐莲</td>
        </tr>
        <tr>
            <td>唐三</td>
            <td>男</td>
            <td>19</td>
            <td>斗罗大陆</td>
            <td>43级</td>
            <td>昊天锤</td>
        </tr>
    </table>
<!-- 规范格式 -->
    <table>
        <!-- 规范表格头 -->
        <thead>
            <tr>
                <th>姓名</th>
                <th>性别</th>
                <th>年龄</th>
                <th>宗门</th>
                <th>资质</th>
                <th>武魂</th>
            </tr>
        </thead>
        <!-- 规范表格体 -->
        <tbody>
        <tr>
            <!-- 单元格（内容） -->
            <td>消炎</td>
            <td>男</td>
            <td>19</td>
            <td>斗破苍穹</td>
            <td>三段斗之力</td>
            <td>佛怒唐莲</td>
        </tr>
        <tr>
            <td>唐三</td>
            <td>男</td>
            <td>19</td>
            <td>斗罗大陆</td>
            <td>43级</td>
            <td>昊天锤</td>
        </tr>
        </tbody>
    </table>
</body>
</html>
