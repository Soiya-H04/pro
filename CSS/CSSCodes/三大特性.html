<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三大特性</title>
    <link rel="stylesheet" href="./Sources/三大特性 CSS.css">
</head>
<body>
    <!-- 1. 层叠 -->
    <div>
        这是 div
    </div>

    <!-- 2. 继承 -->
     <div>
        <p>这是 p</p>
     </div>

    <!-- 3. 优先级 -->
    <div>
        <ul>
            <li>这是 li</li>
            <li class="li">这是 li</li>
        </ul>
        <ul>
            <li id="li">这是 li</li>
            <li>这是 li</li>
        </ul>
    </div>
</body>
</html>
