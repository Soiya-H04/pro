<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通配符选择器</title>
    <style>
        * {
            color: red;
        }
    </style>
</head>
<body>
    <div>
        <p>这是红</p>
        <p>这是红</p>
        <p>这是红</p>
    </div>
    <p>这是红</p>
    <p>这是红</p>
    <p>这是红</p>
    <p>这是红</p>
    <span>这是红</span><br>
    <span>这是红</span><br>
    <span>这是红</span><br>
    <span>这是红</span><br>
</body>
</html>
