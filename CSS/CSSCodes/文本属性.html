<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本属性</title>
    <style>
        .t1 {
            /* RGB 形式文本颜色 */
            color: rgb(255,122,212);
            /* 文本对齐 */
            text-align: left;
            /* 文本装饰 */
            text-decoration: dotted;
            /* 文本缩进 */
            text-indent: 10px;
            /* 行间距 */
            line-height: 30px;
        }
        .t2 {
            /* 十六进制文本颜色 */
            color: #FF00F3;
            text-align: center;
            text-decoration: underline;
            text-indent: 20px;
            line-height: 50px;
        }
        .t3 {
            /* 预定义文本颜色 */
            color: blue;
            text-align: right;
            text-decoration: line-through;
            text-indent: 30px;
            line-height: 40px;
        }

    </style>
</head>
<body>
    <div class="t1">
        <p>这是不同 div 的文字</p>
        <p>这是不同 div 的文字</p>
        <p>这是不同 div 的文字</p>
    </div>
    <div class="t2">
        <p>这是不同 div 的文字</p>
        <p>这是不同 div 的文字</p>
        <p>这是不同 div 的文字</p>
    </div>
    <div class="t3">
        <p>这是不同 div 的文字</p>
        <p>这是不同 div 的文字</p>
        <p>这是不同 div 的文字</p>
    </div>
</body>
</html>
