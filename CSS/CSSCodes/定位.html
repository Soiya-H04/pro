<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Sources/定位 CSS.css">
    <title>定位</title>
</head>
<body>
    <!-- 相对定位 -->
     <div class="relative box">
        相对
     </div>
     <div class="box">
        标准
     </div>

    <!-- 绝对定位 -->
     <div class="absolute box">
        绝对
     </div>
    <div class="box">
        标准
     </div>

    <!-- 子绝父相 -->
    <div class="relative box">
        <div class="absolute smallbox">

        </div>
    </div>

    <!-- 固定定位 -->
    <div class="fix smallbox">
        固定
    </div>

</body>
</html>
